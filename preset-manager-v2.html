<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClyphX Pro Preset Manager</title>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: #0a0a0f;
            color: #e0e0e0;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Ambient gradient orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            z-index: 0;
            pointer-events: none;
        }
        body::before {
            top: -20%; right: -10%;
            width: 600px; height: 600px;
            background: rgba(139, 92, 246, 0.08);
        }
        body::after {
            bottom: -20%; left: -10%;
            width: 600px; height: 600px;
            background: rgba(34, 211, 238, 0.06);
        }

        .app-container {
            position: relative;
            z-index: 1;
            max-width: 1800px;
            margin: 0 auto;
            padding: 20px;
        }

        /* Glass card base */
        .glass {
            background: rgba(255,255,255,0.03);
            border: 1px solid rgba(255,255,255,0.06);
            border-radius: 12px;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .glass:hover {
            border-color: rgba(255,255,255,0.1);
        }

        /* Gradient title */
        .gradient-title {
            background: linear-gradient(135deg, #8b5cf6, #22d3ee);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-weight: 700;
        }

        /* Sticky toolbar */
        .toolbar {
            position: sticky;
            top: 0;
            z-index: 50;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            background: rgba(10,10,15,0.85);
            border-bottom: 1px solid rgba(255,255,255,0.06);
            padding: 12px 20px;
            margin: -20px -20px 20px -20px;
        }

        /* Slot grid */
        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
            padding: 12px;
        }

        /* Slots */
        .slot {
            background: rgba(255,255,255,0.02);
            border: 1px dashed rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 10px;
            min-height: 72px;
            cursor: pointer;
            transition: all 0.15s ease;
            position: relative;
        }

        .slot.filled {
            border: 1px solid rgba(74, 222, 128, 0.2);
            background: rgba(74, 222, 128, 0.04);
        }
        .slot.filled:hover {
            border-color: rgba(74, 222, 128, 0.35);
            background: rgba(74, 222, 128, 0.07);
            box-shadow: 0 0 12px rgba(74, 222, 128, 0.08);
        }

        .slot.empty:hover {
            border-color: rgba(255,255,255,0.15);
            background: rgba(255,255,255,0.04);
        }

        .slot.selected {
            border-color: #8b5cf6 !important;
            border-style: solid !important;
            background: rgba(139, 92, 246, 0.08) !important;
            box-shadow: 0 0 16px rgba(139, 92, 246, 0.25), inset 0 0 16px rgba(139, 92, 246, 0.05);
        }

        .slot.drag-over {
            border-color: #22d3ee !important;
            border-style: solid !important;
            background: rgba(34, 211, 238, 0.08) !important;
            box-shadow: 0 0 16px rgba(34, 211, 238, 0.2);
        }

        .slot.drag-over-insert-above {
            border-top: 3px solid #22d3ee;
            margin-top: -1px;
        }

        .slot-number {
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            color: rgba(255,255,255,0.25);
            margin-bottom: 4px;
            font-weight: 500;
        }

        .slot-name {
            font-size: 12px;
            color: #e0e0e0;
            word-break: break-word;
            line-height: 1.3;
            font-weight: 400;
        }

        .slot.empty .slot-name {
            color: rgba(255,255,255,0.15);
            font-style: italic;
        }

        .remove-btn {
            position: absolute;
            top: 4px; right: 4px;
            background: rgba(239, 68, 68, 0.8);
            color: white;
            border: none;
            border-radius: 6px;
            width: 20px; height: 20px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            line-height: 1;
            padding: 0;
            transition: background 0.15s;
            backdrop-filter: blur(4px);
        }
        .remove-btn:hover { background: rgba(239, 68, 68, 1); }
        .slot.filled:hover .remove-btn { display: flex; align-items: center; justify-content: center; }

        /* Slot animations */
        .slot.shift-down { animation: shiftDown 0.35s ease-out; }
        .slot.shift-up { animation: shiftUp 0.35s ease-out; }
        .slot.insert-highlight { animation: insertPop 0.4s ease-out; }

        @keyframes shiftDown {
            0% { transform: translateY(-100%); opacity: 0.5; }
            60% { transform: translateY(5%); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes shiftUp {
            0% { transform: translateY(100%); opacity: 0.5; }
            60% { transform: translateY(-5%); opacity: 1; }
            100% { transform: translateY(0); opacity: 1; }
        }
        @keyframes insertPop {
            0% { transform: scale(0.8); opacity: 0.3; box-shadow: 0 0 0 rgba(139,92,246,0); }
            50% { transform: scale(1.05); box-shadow: 0 0 20px rgba(139,92,246,0.6); }
            100% { transform: scale(1); opacity: 1; box-shadow: 0 0 0 rgba(139,92,246,0); }
        }

        /* Bank accordion */
        .bank-card {
            margin-bottom: 16px;
        }

        .bank-header {
            padding: 16px 20px;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
            border-radius: 12px;
        }
        .bank-card:not(.collapsed) .bank-header {
            border-radius: 12px 12px 0 0;
        }
        .bank-header:hover {
            background: rgba(255,255,255,0.05);
        }
        .collapse-sections-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 28px;
            height: 28px;
            border-radius: 6px;
            border: 1px solid rgba(255,255,255,0.08);
            background: rgba(255,255,255,0.04);
            color: rgba(255,255,255,0.4);
            cursor: pointer;
            transition: all 0.15s;
        }
        .collapse-sections-btn:hover {
            background: rgba(139, 92, 246, 0.15);
            border-color: rgba(139, 92, 246, 0.3);
            color: rgba(255,255,255,0.8);
        }

        .bank-content {
            padding: 16px;
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out, opacity 0.3s ease-out;
            opacity: 1;
            border-top: 1px solid rgba(255,255,255,0.04);
        }
        .bank-card.collapsed .bank-content {
            max-height: 0;
            padding: 0 16px;
            opacity: 0;
        }

        .bank-arrow {
            transition: transform 0.3s ease;
            color: rgba(255,255,255,0.4);
        }
        .bank-card.collapsed .bank-arrow {
            transform: rotate(-90deg);
        }

        /* Page sections */
        .page-section {
            margin-bottom: 12px;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid rgba(255,255,255,0.04);
            transition: border-color 0.2s;
        }
        .page-section:hover { border-color: rgba(255,255,255,0.08); }

        .page-title {
            font-size: 13px;
            color: #e0e0e0;
            padding: 10px 14px;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 600;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s;
        }
        .page-title:hover { filter: brightness(1.15); }

        .page-title-arrow {
            transition: transform 0.3s ease;
            color: rgba(255,255,255,0.4);
            font-size: 12px;
        }
        .page-section.collapsed .page-title-arrow {
            transform: rotate(-90deg);
        }

        .page-content {
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
            background: rgba(0,0,0,0.2);
        }
        .page-section.collapsed .page-content {
            max-height: 0;
        }

        /* Modal */
        .modal-overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: rgba(20,20,30,0.95);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 16px;
            padding: 32px;
            max-width: 700px;
            width: 90%;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            box-shadow: 0 24px 48px rgba(0,0,0,0.4);
        }

        .modal-card textarea {
            width: 100%;
            height: 300px;
            background: rgba(0,0,0,0.4);
            color: #e0e0e0;
            border: 1px solid rgba(255,255,255,0.08);
            border-radius: 8px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            resize: vertical;
        }
        .modal-card textarea:focus {
            outline: none;
            border-color: rgba(139,92,246,0.4);
        }

        /* Toast notification */
        .toast-container {
            position: fixed;
            bottom: 24px;
            right: 24px;
            z-index: 2000;
            pointer-events: none;
        }

        .toast-message {
            background: rgba(20,20,30,0.92);
            border: 1px solid rgba(255,255,255,0.1);
            border-radius: 10px;
            padding: 12px 20px;
            font-size: 13px;
            font-weight: 500;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            opacity: 0;
            transform: translateY(8px);
            transition: opacity 0.2s, transform 0.2s;
            pointer-events: auto;
        }
        .toast-message.show {
            opacity: 1;
            transform: translateY(0);
        }
        .toast-message.success {
            border-left: 3px solid #4ade80;
            color: #4ade80;
        }
        .toast-message.error {
            border-left: 3px solid #ef4444;
            color: #ef4444;
        }
        .toast-message:not(.success):not(.error) {
            border-left: 3px solid #94a3b8;
            color: #94a3b8;
        }

        /* Preserved controls */
        .preserved-list {
            background: rgba(0,0,0,0.3);
            padding: 16px;
            border-radius: 8px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: rgba(255,255,255,0.4);
            border: 1px solid rgba(255,255,255,0.04);
        }
        .preserved-list div { margin-bottom: 4px; }

        input[type="file"] { display: none; }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 3px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.2); }

        /* Button overrides for DaisyUI */
        .btn-primary-custom {
            background: #8b5cf6 !important;
            border-color: #8b5cf6 !important;
            color: white !important;
        }
        .btn-primary-custom:hover {
            background: #7c3aed !important;
            border-color: #7c3aed !important;
        }

        @media (max-width: 1200px) {
            .slots-grid { grid-template-columns: repeat(2, 1fr); }
        }
        @media (max-width: 640px) {
            .slots-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <div class="glass p-6 mb-5">
            <h1 class="gradient-title text-3xl mb-1">ClyphX Pro Preset Manager</h1>
            <p class="text-sm text-white/30 font-light">Drag-and-drop interface for managing your 5-bank preset system (560 total presets)</p>
        </div>

        <!-- Toolbar -->
        <div class="toolbar flex items-center gap-3 flex-wrap">
            <label class="btn btn-sm btn-ghost border border-white/10 hover:border-white/20 cursor-pointer gap-2 text-white/70 hover:text-white/90">
                <i data-lucide="upload" class="w-4 h-4"></i>
                Import X-Controls.txt
                <input type="file" id="importFile" accept=".txt">
            </label>
            <div class="divider divider-horizontal mx-1 h-6 opacity-20"></div>
            <button onclick="undo()" id="undoBtn" class="btn btn-sm btn-ghost border border-white/10 hover:border-white/20 gap-1 text-white/60" disabled>
                <i data-lucide="undo-2" class="w-4 h-4"></i> Undo
            </button>
            <button onclick="redo()" id="redoBtn" class="btn btn-sm btn-ghost border border-white/10 hover:border-white/20 gap-1 text-white/60" disabled>
                <i data-lucide="redo-2" class="w-4 h-4"></i> Redo
            </button>
            <button onclick="clearAll()" class="btn btn-sm btn-ghost border border-white/10 hover:border-white/20 gap-1 text-white/60 hover:text-red-400 hover:border-red-400/30">
                <i data-lucide="trash-2" class="w-4 h-4"></i> Clear All
            </button>
            <div class="flex-1"></div>
            <button onclick="showPreview()" class="btn btn-sm btn-ghost border border-white/10 hover:border-white/20 gap-1 text-white/60">
                <i data-lucide="eye" class="w-4 h-4"></i> Preview
            </button>
            <button onclick="generateFile()" class="btn btn-sm btn-primary-custom gap-1">
                <i data-lucide="download" class="w-4 h-4"></i> Generate X-Controls.txt
            </button>
        </div>

        <!-- Banks -->
        <div id="banksContainer" class="mb-5"></div>

        <!-- Preserved Controls -->
        <div class="glass p-5">
            <h3 class="text-sm font-semibold text-white/60 uppercase tracking-wider mb-3 flex items-center gap-2">
                <i data-lucide="shield-check" class="w-4 h-4 text-emerald-400/60"></i>
                Preserved Controls
                <span class="text-white/25 font-normal lowercase tracking-normal">(will not be modified)</span>
            </h3>
            <div class="preserved-list" id="preservedList">
                No X-Controls.txt imported yet. Import a file to see preserved controls.
            </div>
        </div>
    </div>

    <!-- Toast container -->
    <div class="toast-container" id="toastContainer"></div>

    <!-- Preview Modal -->
    <div class="modal-overlay" id="previewModal">
        <div class="modal-card">
            <div class="flex items-center justify-between mb-5">
                <h2 class="text-lg font-semibold text-white/90">Preview X-Controls.txt</h2>
                <button onclick="closePreview()" class="btn btn-sm btn-ghost btn-circle text-white/40 hover:text-white/80">
                    <i data-lucide="x" class="w-4 h-4"></i>
                </button>
            </div>
            <textarea id="previewText" readonly></textarea>
            <div class="flex gap-3 justify-end mt-5">
                <button onclick="closePreview()" class="btn btn-sm btn-ghost border border-white/10 text-white/60">Close</button>
                <button onclick="generateFile()" class="btn btn-sm btn-primary-custom gap-1">
                    <i data-lucide="download" class="w-4 h-4"></i> Download File
                </button>
            </div>
        </div>
    </div>

    <script>
        // Data structure - 5 banks total (560 presets!)
        const banks = {
            1: Array(112).fill(null),
            2: Array(112).fill(null),
            3: Array(112).fill(null),
            4: Array(112).fill(null),
            5: Array(112).fill(null)
        };

        let preservedHeader = '';
        let preservedFooter = '';
        let preservedControls = [];

        // Selection state
        let selectedSlots = new Set();
        let lastSelectedSlot = null;

        // Undo/Redo history
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50;

        let draggedSlot = null;
        let draggedGroup = null;

        const pages = [
            { name: 'Acoustic Drums', start: 0, count: 16, colorIndex: 62, swapWait: 0 },
            { name: 'Electronic Drums', start: 16, count: 16, colorIndex: 19, swapWait: 0 },
            { name: 'Bass', start: 32, count: 16, colorIndex: 18, swapWait: 0 },
            { name: 'Keyboards', start: 48, count: 16, colorIndex: 24, swapWait: 0 },
            { name: 'Synths', start: 64, count: 16, colorIndex: 67, swapWait: 0 },
            { name: 'Strings', start: 80, count: 16, colorIndex: 15, swapWait: 0 },
            { name: 'Winds', start: 96, count: 16, colorIndex: 56, swapWait: 8 }
        ];

        const categoryColors = {
            0: '#2d8a4e',
            1: '#4ade80',
            2: '#eab308',
            3: '#3b82f6',
            4: '#8b5cf6',
            5: '#ef4444',
            6: '#94a3b8'
        };

        function initBanks() {
            const container = document.getElementById('banksContainer');
            container.innerHTML = '';

            for (let i = 1; i <= 5; i++) {
                const bank = document.createElement('div');
                bank.className = 'bank-card glass';
                bank.dataset.bankNum = i;

                const collapseKey = `bank-collapse-${i}`;
                const isCollapsed = localStorage.getItem(collapseKey) === 'true';
                if (isCollapsed) bank.classList.add('collapsed');

                const header = document.createElement('div');
                header.className = 'bank-header';
                header.innerHTML = `
                    <div class="flex items-center gap-3">
                        <div class="flex items-center justify-center w-8 h-8 rounded-lg bg-purple-500/10 border border-purple-500/20">
                            <i data-lucide="music" class="w-4 h-4 text-purple-400/80"></i>
                        </div>
                        <div>
                            <span class="font-semibold text-white/90">Bank ${i}</span>
                            <span class="text-white/30 mx-2">-</span>
                            <span class="text-white/50 text-sm">MIDI Channel ${i}</span>
                        </div>
                        <span class="text-xs text-white/25 font-mono ml-2" id="bank${i}-count">0/112 filled</span>
                        <button class="collapse-sections-btn" title="Collapse/Expand all sections" data-bank="${i}">
                            <i data-lucide="rows-3" class="w-3.5 h-3.5"></i>
                        </button>
                    </div>
                    <i data-lucide="chevron-down" class="w-4 h-4 bank-arrow"></i>
                `;
                header.addEventListener('click', (e) => {
                    if (e.target.closest('.collapse-sections-btn')) return;
                    toggleBank(bank);
                });
                header.querySelector('.collapse-sections-btn').addEventListener('click', (e) => {
                    e.stopPropagation();
                    toggleAllSections(parseInt(e.currentTarget.dataset.bank));
                });

                const content = document.createElement('div');
                content.className = 'bank-content';
                content.id = `bank${i}`;

                bank.appendChild(header);
                bank.appendChild(content);
                container.appendChild(bank);

                renderBank(i);
            }
            lucide.createIcons();
        }

        function toggleBank(bank) {
            bank.classList.toggle('collapsed');
            const bankNum = bank.dataset.bankNum;
            const collapseKey = `bank-collapse-${bankNum}`;
            localStorage.setItem(collapseKey, bank.classList.contains('collapsed'));
        }

        function renderBank(bankNum) {
            const container = document.getElementById(`bank${bankNum}`);
            container.innerHTML = '';

            pages.forEach((page, pageIndex) => {
                const color = categoryColors[pageIndex];
                const section = document.createElement('div');
                section.className = `page-section category-${pageIndex}`;
                section.dataset.bank = bankNum;
                section.dataset.page = pageIndex;

                const collapseKey = `collapse-${bankNum}-${pageIndex}`;
                const isCollapsed = localStorage.getItem(collapseKey) === 'true';
                if (isCollapsed) section.classList.add('collapsed');

                const title = document.createElement('div');
                title.className = 'page-title';
                title.style.cssText = `border-left: 3px solid ${color}; background: ${color}12;`;
                title.innerHTML = `
                    <span class="page-title-text flex items-center gap-2">
                        <span style="color: ${color};">${page.name}</span>
                        <span class="text-white/20 text-xs font-mono font-normal">(Slots ${page.start + 1}-${page.start + page.count})</span>
                    </span>
                    <span class="page-title-arrow">&#9660;</span>
                `;
                title.addEventListener('click', () => toggleSection(section));
                section.appendChild(title);

                const content = document.createElement('div');
                content.className = 'page-content';

                const grid = document.createElement('div');
                grid.className = 'slots-grid';

                for (let i = 0; i < page.count; i++) {
                    const slotIndex = page.start + i;
                    grid.appendChild(createSlot(bankNum, slotIndex));
                }

                content.appendChild(grid);
                section.appendChild(content);
                container.appendChild(section);
            });

            updateBankCount(bankNum);
            lucide.createIcons();
        }

        function toggleSection(section) {
            section.classList.toggle('collapsed');
            const bank = section.dataset.bank;
            const page = section.dataset.page;
            const collapseKey = `collapse-${bank}-${page}`;
            localStorage.setItem(collapseKey, section.classList.contains('collapsed'));
        }

        function toggleAllSections(bankNum) {
            const container = document.getElementById(`bank${bankNum}`);
            const sections = container.querySelectorAll('.page-section');
            // If any section is expanded, collapse all. Otherwise expand all.
            const anyExpanded = Array.from(sections).some(s => !s.classList.contains('collapsed'));
            sections.forEach(section => {
                const shouldCollapse = anyExpanded;
                if (shouldCollapse) {
                    section.classList.add('collapsed');
                } else {
                    section.classList.remove('collapsed');
                }
                const collapseKey = `collapse-${section.dataset.bank}-${section.dataset.page}`;
                localStorage.setItem(collapseKey, shouldCollapse);
            });
        }

        function createSlot(bankNum, index) {
            const slot = document.createElement('div');
            const slotKey = `${bankNum}-${index}`;

            let className = banks[bankNum][index] ? 'slot filled' : 'slot empty';
            if (selectedSlots.has(slotKey)) className += ' selected';

            slot.className = className;
            slot.dataset.bank = bankNum;
            slot.dataset.index = index;
            slot.draggable = banks[bankNum][index] !== null || selectedSlots.size > 0;

            slot.innerHTML = `
                <div class="slot-number">Slot ${index + 1} (Note ${index})</div>
                <div class="slot-name">${banks[bankNum][index] || 'Empty'}</div>
                ${banks[bankNum][index] ? '<button class="remove-btn" onclick="removePreset(event, ' + bankNum + ', ' + index + ')">&#215;</button>' : ''}
            `;

            slot.addEventListener('dragstart', handleDragStart);
            slot.addEventListener('dragover', handleDragOver);
            slot.addEventListener('drop', handleDrop);
            slot.addEventListener('dragleave', handleDragLeave);
            slot.addEventListener('click', handleSlotClick);
            slot.addEventListener('dblclick', handleSlotDoubleClick);

            return slot;
        }

        function handleSlotClick(e) {
            if (e.target.classList.contains('remove-btn')) return;

            const slot = e.currentTarget;
            const bank = slot.dataset.bank;
            const index = parseInt(slot.dataset.index);
            const slotKey = `${bank}-${index}`;

            const isCmdOrCtrl = e.metaKey || e.ctrlKey;
            const isShift = e.shiftKey;

            if (isShift && lastSelectedSlot) {
                const [lastBank, lastIndex] = lastSelectedSlot.split('-').map(Number);
                if (parseInt(bank) === lastBank) {
                    const start = Math.min(lastIndex, index);
                    const end = Math.max(lastIndex, index);
                    for (let i = start; i <= end; i++) {
                        const key = `${bank}-${i}`;
                        if (banks[bank][i]) selectedSlots.add(key);
                    }
                    renderBank(parseInt(bank));
                    setStatus(`Selected ${end - start + 1} slots`, 'success');
                }
            } else if (isCmdOrCtrl) {
                if (selectedSlots.has(slotKey)) {
                    selectedSlots.delete(slotKey);
                } else {
                    if (banks[bank][index]) selectedSlots.add(slotKey);
                }
                lastSelectedSlot = slotKey;
                renderBank(parseInt(bank));
                setStatus(`${selectedSlots.size} slots selected`, 'success');
            } else {
                selectedSlots.clear();
                if (banks[bank][index]) {
                    selectedSlots.add(slotKey);
                    lastSelectedSlot = slotKey;
                }
                renderBank(parseInt(bank));
                if (selectedSlots.size > 0) {
                    setStatus('Slot selected (double-click to rename)', 'success');
                }
            }
        }

        function handleSlotDoubleClick(e) {
            if (e.target.classList.contains('remove-btn')) return;

            const slot = e.currentTarget;
            const bank = slot.dataset.bank;
            const index = slot.dataset.index;

            const presetName = prompt('Enter preset filename (e.g., "LABS - Percussion.adg"):', banks[bank][index] || '');
            if (presetName !== null && presetName.trim() !== '') {
                banks[bank][index] = presetName.trim();
                selectedSlots.clear();
                renderBank(parseInt(bank));
                saveState();
                setStatus('Preset updated', 'success');
            } else if (presetName === '') {
                banks[bank][index] = null;
                selectedSlots.clear();
                renderBank(parseInt(bank));
                saveState();
                setStatus('Preset removed', 'success');
            }
        }

        function removePreset(e, bank, index) {
            e.stopPropagation();
            banks[bank][index] = null;
            renderBank(bank);
            saveState();
            setStatus('Preset removed', 'success');
        }

        function handleDragStart(e) {
            draggedSlot = e.currentTarget;
            const slotKey = `${e.currentTarget.dataset.bank}-${e.currentTarget.dataset.index}`;

            if (selectedSlots.size > 1 && selectedSlots.has(slotKey)) {
                draggedGroup = Array.from(selectedSlots).map(key => {
                    const [bank, index] = key.split('-').map(Number);
                    return { bank, index, preset: banks[bank][index] };
                });
                e.currentTarget.style.opacity = '0.5';
                document.querySelectorAll('.slot.selected').forEach(slot => {
                    slot.style.opacity = '0.5';
                });
            } else {
                draggedGroup = null;
                e.currentTarget.style.opacity = '0.5';
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const targetSlot = e.currentTarget;

            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const targetBank = parseInt(targetSlot.dataset.bank);
                let targetIndex = parseInt(targetSlot.dataset.index);

                const files = Array.from(e.dataTransfer.files);
                const adgFiles = files.filter(f => f.name.toLowerCase().endsWith('.adg'));

                if (adgFiles.length === 0) {
                    setStatus('Only .adg files are supported', '');
                    return;
                }

                let addedCount = 0;
                for (const file of adgFiles) {
                    if (targetIndex >= 112) {
                        setStatus(`Added ${addedCount} presets (reached end of bank)`, 'success');
                        renderBank(targetBank);
                        if (draggedSlot) { draggedSlot.style.opacity = '1'; draggedSlot = null; }
                        return;
                    }
                    banks[targetBank][targetIndex] = file.name;
                    targetIndex++;
                    addedCount++;
                }

                renderBank(targetBank);
                saveState();

                if (adgFiles.length === 1) {
                    setStatus(`Added preset: ${adgFiles[0].name}`, 'success');
                } else {
                    setStatus(`Added ${addedCount} presets starting at slot ${parseInt(targetSlot.dataset.index) + 1}`, 'success');
                }

                if (draggedSlot) { draggedSlot.style.opacity = '1'; draggedSlot = null; }
                return;
            }

            if (draggedGroup && draggedGroup.length > 0) {
                const targetBank = parseInt(targetSlot.dataset.bank);
                let targetIndex = parseInt(targetSlot.dataset.index);

                draggedGroup.forEach(item => { banks[item.bank][item.index] = null; });

                let placedCount = 0;
                for (const item of draggedGroup) {
                    if (targetIndex >= 112) break;
                    banks[targetBank][targetIndex] = item.preset;
                    targetIndex++;
                    placedCount++;
                }

                selectedSlots.clear();
                lastSelectedSlot = null;

                const affectedBanks = new Set([targetBank, ...draggedGroup.map(item => item.bank)]);
                affectedBanks.forEach(bankNum => renderBank(bankNum));

                setStatus(`Moved ${placedCount} presets`, 'success');

                document.querySelectorAll('.slot.selected').forEach(slot => { slot.style.opacity = '1'; });

                saveState();
                draggedGroup = null;
            } else if (draggedSlot && draggedSlot !== targetSlot) {
                const sourceBank = parseInt(draggedSlot.dataset.bank);
                const sourceIndex = parseInt(draggedSlot.dataset.index);
                const targetBank = parseInt(targetSlot.dataset.bank);
                const targetIndex = parseInt(targetSlot.dataset.index);

                if (sourceBank === targetBank) {
                    const preset = banks[sourceBank][sourceIndex];
                    banks[sourceBank].splice(sourceIndex, 1);
                    banks[sourceBank].splice(targetIndex, 0, preset);

                    renderBank(sourceBank);

                    const direction = sourceIndex > targetIndex ? 'shift-down' : 'shift-up';
                    const start = Math.min(sourceIndex, targetIndex);
                    const end = Math.max(sourceIndex, targetIndex);
                    const bankContainer = document.getElementById(`bank${sourceBank}`);
                    const allSlots = bankContainer.querySelectorAll('.slot');

                    allSlots.forEach(slot => {
                        const idx = parseInt(slot.dataset.index);
                        if (idx === targetIndex) {
                            slot.classList.add('insert-highlight');
                        } else if (idx >= start && idx <= end) {
                            slot.classList.add(direction);
                        }
                    });

                    setTimeout(() => {
                        allSlots.forEach(slot => {
                            slot.classList.remove('shift-down', 'shift-up', 'insert-highlight');
                        });
                    }, 400);

                    setStatus(`Inserted preset at slot ${targetIndex + 1}`, 'success');
                } else {
                    const temp = banks[targetBank][targetIndex];
                    banks[targetBank][targetIndex] = banks[sourceBank][sourceIndex];
                    banks[sourceBank][sourceIndex] = temp;

                    renderBank(sourceBank);
                    renderBank(targetBank);
                    setStatus('Presets swapped across banks', 'success');
                }

                saveState();
            }

            if (draggedSlot) { draggedSlot.style.opacity = '1'; draggedSlot = null; }
        }

        function updateBankCount(bankNum) {
            const filled = banks[bankNum].filter(p => p !== null).length;
            const el = document.getElementById(`bank${bankNum}-count`);
            if (el) el.textContent = `${filled}/112 filled`;
        }

        // Import X-Controls.txt
        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                parseXControls(event.target.result);
                saveState();
                setStatus('File imported successfully!', 'success');
            };
            reader.readAsText(file);
            e.target.value = '';
        });

        function parseXControls(content) {
            const lines = content.split('\n');
            let inBankSection = false;
            let headerLines = [];
            let footerLines = [];
            preservedControls = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                if (line.startsWith('PAD_') && /_B\d =/.test(line)) {
                    inBankSection = true;

                    const match = line.match(/SEL\/SWAP "([^"]+)"/);
                    if (match) {
                        const presetName = match[1];
                        const bankMatch = line.match(/PAD_(\d+)_B(\d)/);
                        if (bankMatch) {
                            const padNum = parseInt(bankMatch[1]) - 1;
                            const bankNum = parseInt(bankMatch[2]);
                            if (padNum >= 0 && padNum < 112 && bankNum >= 1 && bankNum <= 5) {
                                banks[bankNum][padNum] = presetName;
                            }
                        }
                    }
                } else if (line.startsWith('SHOW_PLUGIN') || line.startsWith('HIDE_PLUGIN') ||
                          (line.includes('=') && !line.startsWith('#') && !line.startsWith('[') && line.length > 0)) {
                    if (!line.startsWith('PAD_')) {
                        preservedControls.push(lines[i]);
                    }
                } else if (!inBankSection && line.length > 0) {
                    headerLines.push(lines[i]);
                }
            }

            preservedHeader = headerLines.join('\n');
            preservedFooter = preservedControls.join('\n');

            for (let i = 1; i <= 5; i++) {
                renderBank(i);
            }
            displayPreservedControls();
        }

        function displayPreservedControls() {
            const container = document.getElementById('preservedList');
            if (preservedControls.length === 0) {
                container.innerHTML = '<div style="color: rgba(255,255,255,0.2);">No custom controls found</div>';
            } else {
                container.innerHTML = preservedControls
                    .map(line => `<div><span class="text-emerald-400/60">&#10003;</span> ${line.trim()}</div>`)
                    .join('');
            }
        }

        function clearAll() {
            if (!confirm('Are you sure you want to clear all presets? This cannot be undone.')) return;

            for (let i = 1; i <= 5; i++) {
                banks[i] = Array(112).fill(null);
                renderBank(i);
            }
            setStatus('All presets cleared', 'success');
        }

        function deriveTrackName(presetFilename) {
            if (!presetFilename || presetFilename === 'PLACEHOLDER') return null;
            let name = presetFilename.replace(/\.adg$/i, '');
            const prefixMatch = name.match(/^(\d+)\s*-\s*(.+)$/);
            if (prefixMatch) {
                const num = prefixMatch[1];
                const rest = prefixMatch[2].trim();
                const parenMatch = rest.match(/^(.+?)\s*(\(.+\))$/);
                if (parenMatch) {
                    name = `${parenMatch[1]} ${num} ${parenMatch[2]}`;
                } else {
                    name = `${rest} ${num}`;
                }
            }
            return name.trim();
        }

        function getColorIndexForSlot(slotIndex) {
            for (const page of pages) {
                if (slotIndex >= page.start && slotIndex < page.start + page.count) {
                    return page.colorIndex;
                }
            }
            return 69;
        }

        function generateXControlsText() {
            let output = preservedHeader || getDefaultHeader();
            output += '\n\n';

            for (let bankNum = 1; bankNum <= 5; bankNum++) {
                output += '# ----------------------------------------------------------------------------------------\n';
                output += `# BANK ${bankNum} - MIDI CHANNEL ${bankNum} (Notes 0-111)\n`;
                output += '# ----------------------------------------------------------------------------------------\n\n';

                pages.forEach(page => {
                    output += `# ${page.name.toUpperCase()} (Notes ${page.start}-${page.start + page.count - 1})\n`;
                    for (let i = 0; i < page.count; i++) {
                        const index = page.start + i;
                        const preset = banks[bankNum][index] || 'PLACEHOLDER';
                        const trackName = deriveTrackName(preset);
                        const colorIdx = page.colorIndex;
                        let line = `PAD_${index + 1}_B${bankNum} = NOTE, ${bankNum}, ${index}, 0, 127, SEL/DEV(1) SEL ; WAIT 1 ; SEL/SWAP "${preset}"`;
                        if (trackName) {
                            if (page.swapWait > 0) {
                                line += ` ; WAIT ${page.swapWait}`;
                            }
                            line += ` ; SEL/NAME "${trackName}" ; SEL/COLOR ${colorIdx}`;
                        }
                        output += line + '\n';
                    }
                    output += '\n';
                });
            }

            if (preservedFooter) {
                output += '# ----------------------------------------------------------------------------------------\n';
                output += '# CUSTOM CONTROLS (PRESERVED)\n';
                output += '# ----------------------------------------------------------------------------------------\n\n';
                output += preservedFooter + '\n';
            }

            return output;
        }

        function getDefaultHeader() {
            return `#********************************** [SETTINGS NOTES] **********************************

# Please DO NOT change any of the spacing in this file.

# After saving this file, you will need to load a new Live Set/reload the
# current Live Set for your changes to take effect.

# --------------------------------------------------------------------------------------

[X-CONTROLS]

# 5-BANK CHANNEL-BASED PRESET SYSTEM (560 total presets)
# Generated by ClyphX Pro Preset Manager

# --------------------------------------------------------------------------------------`;
        }

        function showPreview() {
            const text = generateXControlsText();
            document.getElementById('previewText').value = text;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function generateFile() {
            const text = generateXControlsText();
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'X-Controls.txt';
            a.click();
            URL.revokeObjectURL(url);

            closePreview();
            setStatus('File downloaded! Replace your existing X-Controls.txt', 'success');
        }

        let toastTimeout = null;
        function setStatus(message, type = '') {
            const container = document.getElementById('toastContainer');

            // Clear existing
            container.innerHTML = '';
            if (toastTimeout) clearTimeout(toastTimeout);

            if (!message) return;

            const toast = document.createElement('div');
            toast.className = `toast-message ${type}`;
            toast.textContent = message;
            container.appendChild(toast);

            // Trigger animation
            requestAnimationFrame(() => {
                toast.classList.add('show');
            });

            toastTimeout = setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => { container.innerHTML = ''; }, 200);
            }, 4000);
        }

        // Undo/Redo system
        function saveState() {
            const state = {
                banks: {
                    1: [...banks[1]],
                    2: [...banks[2]],
                    3: [...banks[3]],
                    4: [...banks[4]],
                    5: [...banks[5]]
                }
            };

            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }

            history.push(state);

            if (history.length > MAX_HISTORY) {
                history.shift();
            } else {
                historyIndex++;
            }

            updateUndoRedoButtons();
        }

        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(history[historyIndex]);
                setStatus('Undone', 'success');
            }
        }

        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
                setStatus('Redone', 'success');
            }
        }

        function restoreState(state) {
            for (let i = 1; i <= 5; i++) {
                banks[i] = [...state.banks[i]];
                renderBank(i);
            }
            updateUndoRedoButtons();
        }

        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            }
            else if ((e.metaKey || e.ctrlKey) && e.key === 'z' && e.shiftKey) {
                e.preventDefault();
                redo();
            }
            else if ((e.metaKey || e.ctrlKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
            else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedSlots.size > 0) {
                e.preventDefault();
                deleteSelectedPresets();
            }
        });

        function deleteSelectedPresets() {
            if (selectedSlots.size === 0) return;

            const affectedBanks = new Set();
            const count = selectedSlots.size;

            selectedSlots.forEach(slotKey => {
                const [bank, index] = slotKey.split('-').map(Number);
                banks[bank][index] = null;
                affectedBanks.add(bank);
            });

            selectedSlots.clear();
            lastSelectedSlot = null;

            affectedBanks.forEach(bankNum => renderBank(bankNum));

            saveState();

            setStatus(`Deleted ${count} preset${count > 1 ? 's' : ''}`, 'success');
        }

        // Initialize
        saveState();
        initBanks();
        setStatus('Ready! Import your X-Controls.txt or start adding presets.', 'success');
    </script>
</body>
</html>
