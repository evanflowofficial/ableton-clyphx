<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClyphX Pro Preset Manager</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #1a1a1a;
            color: #e0e0e0;
            padding: 20px;
        }

        .container {
            max-width: 1800px;
            margin: 0 auto;
        }

        header {
            background: #2a2a2a;
            padding: 20px;
            border-radius: 8px;
            margin-bottom: 20px;
        }

        h1 {
            margin-bottom: 10px;
            color: #fff;
        }

        .subtitle {
            color: #888;
            font-size: 14px;
        }

        .controls {
            background: #2a2a2a;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            align-items: center;
        }

        button {
            background: #4CAF50;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: background 0.3s;
        }

        button:hover {
            background: #45a049;
        }

        button.secondary {
            background: #555;
        }

        button.secondary:hover {
            background: #666;
        }

        button.danger {
            background: #f44336;
        }

        button.danger:hover {
            background: #da190b;
        }

        .status {
            flex: 1;
            text-align: right;
            color: #888;
            font-size: 14px;
        }

        .status.success {
            color: #4CAF50;
        }

        .banks-container {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 20px;
        }

        .bank {
            background: #2a2a2a;
            border-radius: 8px;
            border: 2px solid #444;
            overflow: hidden;
        }

        .bank-header {
            font-size: 18px;
            font-weight: bold;
            padding: 15px 20px;
            color: #fff;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: #333;
            cursor: pointer;
            user-select: none;
            transition: background 0.2s;
        }
        
        .bank-header:hover {
            background: #3a3a3a;
        }
        
        .bank-header-title {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        
        .bank-header-arrow {
            font-size: 14px;
            transition: transform 0.3s;
        }
        
        .bank.collapsed .bank-header-arrow {
            transform: rotate(-90deg);
        }

        .bank-info {
            font-size: 12px;
            color: #888;
        }
        
        .bank-content {
            padding: 20px;
            max-height: 5000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        
        .bank.collapsed .bank-content {
            max-height: 0;
            padding: 0 20px;
        }

        .page-section {
            margin-bottom: 25px;
            border: 1px solid #333;
            border-radius: 5px;
            overflow: hidden;
        }

        .page-title {
            font-size: 14px;
            color: #e0e0e0;
            padding: 12px 15px;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: #333;
            cursor: pointer;
            user-select: none;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.2s;
        }
        
        .page-title:hover {
            background: #3a3a3a;
        }
        
        /* Category-specific colors */
        .page-section.category-0 .page-title {
            background: #2d5016;
            border-left: 4px solid #4a7c2c;
        }
        
        .page-section.category-0 .page-title:hover {
            background: #3d6026;
        }
        
        .page-section.category-1 .page-title {
            background: #3d6026;
            border-left: 4px solid #5a9c3c;
        }
        
        .page-section.category-1 .page-title:hover {
            background: #4d7036;
        }
        
        .page-section.category-2 .page-title {
            background: #7a6020;
            border-left: 4px solid #d4a520;
        }
        
        .page-section.category-2 .page-title:hover {
            background: #8a7030;
        }
        
        .page-section.category-3 .page-title {
            background: #1a4d7a;
            border-left: 4px solid #2a6daa;
        }
        
        .page-section.category-3 .page-title:hover {
            background: #2a5d8a;
        }
        
        .page-section.category-4 .page-title {
            background: #4a2a5a;
            border-left: 4px solid #663399;
        }
        
        .page-section.category-4 .page-title:hover {
            background: #5a3a6a;
        }
        
        .page-section.category-5 .page-title {
            background: #6a2a2a;
            border-left: 4px solid #8b3a3a;
        }
        
        .page-section.category-5 .page-title:hover {
            background: #7a3a3a;
        }
        
        .page-section.category-6 .page-title {
            background: #4a4a4a;
            border-left: 4px solid #8a8a8a;
        }
        
        .page-section.category-6 .page-title:hover {
            background: #5a5a5a;
        }
        
        .page-title-text {
            flex: 1;
        }
        
        .page-title-arrow {
            font-size: 12px;
            transition: transform 0.3s;
        }
        
        .page-section.collapsed .page-title-arrow {
            transform: rotate(-90deg);
        }
        
        .page-content {
            padding: 10px;
            background: #2a2a2a;
            max-height: 1000px;
            overflow: hidden;
            transition: max-height 0.3s ease-out, padding 0.3s ease-out;
        }
        
        .page-section.collapsed .page-content {
            max-height: 0;
            padding: 0 10px;
        }

        .slots-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 8px;
        }

        .slot {
            background: #1a1a1a;
            border: 2px dashed #444;
            border-radius: 5px;
            padding: 10px;
            min-height: 70px;
            cursor: pointer;
            transition: all 0.2s;
            position: relative;
        }

        .slot.filled {
            border: 2px solid #4CAF50;
            background: #2a3a2a;
        }

        .slot.drag-over {
            border-color: #2196F3;
            background: #2a2a3a;
        }

        .slot:hover {
            background: #333;
        }

        .slot-number {
            font-size: 10px;
            color: #666;
            margin-bottom: 5px;
        }

        .slot-name {
            font-size: 12px;
            color: #e0e0e0;
            word-break: break-word;
            line-height: 1.3;
        }

        .slot.empty .slot-name {
            color: #666;
            font-style: italic;
        }

        .remove-btn {
            position: absolute;
            top: 2px;
            right: 2px;
            background: #f44336;
            color: white;
            border: none;
            border-radius: 3px;
            width: 18px;
            height: 18px;
            font-size: 12px;
            cursor: pointer;
            display: none;
            line-height: 1;
            padding: 0;
        }

        .slot.filled:hover .remove-btn {
            display: block;
        }

        .slot.selected {
            border-color: #2196F3 !important;
            background: #2a2a3a !important;
            box-shadow: 0 0 10px rgba(33, 150, 243, 0.5);
        }

        .preserved-controls {
            background: #2a2a2a;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .preserved-controls h3 {
            color: #fff;
            margin-bottom: 10px;
            font-size: 16px;
        }

        .preserved-list {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 5px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #888;
        }

        .preserved-list div {
            margin-bottom: 5px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background: #555;
            color: white;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            display: inline-block;
            transition: background 0.3s;
        }

        .file-label:hover {
            background: #666;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.8);
            z-index: 1000;
            align-items: center;
            justify-content: center;
        }

        .modal.active {
            display: flex;
        }

        .modal-content {
            background: #2a2a2a;
            padding: 30px;
            border-radius: 8px;
            max-width: 600px;
            width: 90%;
        }

        .modal-content h2 {
            margin-bottom: 20px;
            color: #fff;
        }

        .modal-content textarea {
            width: 100%;
            height: 300px;
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #444;
            border-radius: 5px;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .modal-buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            justify-content: flex-end;
        }

        @media (max-width: 1200px) {
            .banks-container {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>🎛️ ClyphX Pro Preset Manager</h1>
            <div class="subtitle">Drag-and-drop interface for managing your 5-bank preset system (560 total presets)</div>
        </header>

        <div class="controls">
            <label class="file-label">
                📁 Import X-Controls.txt
                <input type="file" id="importFile" accept=".txt">
            </label>
            <button onclick="undo()" id="undoBtn" class="secondary" disabled>↶ Undo</button>
            <button onclick="redo()" id="redoBtn" class="secondary" disabled>↷ Redo</button>
            <button onclick="clearAll()" class="secondary">🗑️ Clear All</button>
            <button onclick="showPreview()">👁️ Preview</button>
            <button onclick="generateFile()">💾 Generate X-Controls.txt</button>
            <div class="status" id="status"></div>
        </div>

        <div class="banks-container" id="banksContainer"></div>

        <div class="preserved-controls">
            <h3>✅ Preserved Controls (will not be modified)</h3>
            <div class="preserved-list" id="preservedList">
                No X-Controls.txt imported yet. Import a file to see preserved controls.
            </div>
        </div>
    </div>

    <div class="modal" id="previewModal">
        <div class="modal-content">
            <h2>Preview X-Controls.txt</h2>
            <textarea id="previewText" readonly></textarea>
            <div class="modal-buttons">
                <button onclick="closePreview()" class="secondary">Close</button>
                <button onclick="generateFile()">💾 Download File</button>
            </div>
        </div>
    </div>

    <script>
        // Data structure - 5 banks total (560 presets!)
        const banks = {
            1: Array(112).fill(null),
            2: Array(112).fill(null),
            3: Array(112).fill(null),
            4: Array(112).fill(null),
            5: Array(112).fill(null)
        };

        let preservedHeader = '';
        let preservedFooter = '';
        let preservedControls = [];
        
        // Selection state
        let selectedSlots = new Set(); // Stores "bank-index" strings like "1-5", "2-10"
        let lastSelectedSlot = null; // For shift-click range selection
        
        // Undo/Redo history
        let history = [];
        let historyIndex = -1;
        const MAX_HISTORY = 50; // Keep last 50 actions

        // ============================================================================
        // EDIT SECTION NAMES HERE - Change the 'name' property to customize labels
        // ============================================================================
        const pages = [
            { name: 'Acoustic Drums', start: 0, count: 16, colorIndex: 26 },   // Category 0 - Dark Green
            { name: 'Electronic Drums', start: 16, count: 16, colorIndex: 21 }, // Category 1 - Light Green
            { name: 'Bass', start: 32, count: 16, colorIndex: 14 },             // Category 2 - Yellow/Gold
            { name: 'Keyboards', start: 48, count: 16, colorIndex: 37 },        // Category 3 - Deep Blue
            { name: 'Synths', start: 64, count: 16, colorIndex: 49 },           // Category 4 - Purple
            { name: 'Strings', start: 80, count: 16, colorIndex: 4 },           // Category 5 - Red
            { name: 'Winds', start: 96, count: 16, colorIndex: 69 }             // Category 6 - White
        ];
        // ============================================================================

        // Initialize banks
        function initBanks() {
            const container = document.getElementById('banksContainer');
            container.innerHTML = '';
            
            for (let i = 1; i <= 5; i++) {
                const bank = document.createElement('div');
                bank.className = 'bank';
                bank.dataset.bankNum = i;
                
                // Check if bank was previously collapsed
                const collapseKey = `bank-collapse-${i}`;
                const isCollapsed = localStorage.getItem(collapseKey) === 'true';
                if (isCollapsed) {
                    bank.classList.add('collapsed');
                }
                
                const header = document.createElement('div');
                header.className = 'bank-header';
                header.innerHTML = `
                    <div class="bank-header-title">
                        <span>Bank ${i} - MIDI Channel ${i}</span>
                        <span class="bank-info" id="bank${i}-count">0/112 filled</span>
                    </div>
                    <span class="bank-header-arrow">▼</span>
                `;
                header.addEventListener('click', () => toggleBank(bank));
                
                const content = document.createElement('div');
                content.className = 'bank-content';
                content.id = `bank${i}`;
                
                bank.appendChild(header);
                bank.appendChild(content);
                container.appendChild(bank);
                
                renderBank(i);
            }
        }
        
        function toggleBank(bank) {
            bank.classList.toggle('collapsed');
            
            // Save collapse state to localStorage
            const bankNum = bank.dataset.bankNum;
            const collapseKey = `bank-collapse-${bankNum}`;
            const isCollapsed = bank.classList.contains('collapsed');
            localStorage.setItem(collapseKey, isCollapsed);
        }

        function renderBank(bankNum) {
            const container = document.getElementById(`bank${bankNum}`);
            container.innerHTML = '';

            pages.forEach((page, pageIndex) => {
                const section = document.createElement('div');
                section.className = `page-section category-${pageIndex}`;
                section.dataset.bank = bankNum;
                section.dataset.page = pageIndex;
                
                // Check if this section was previously collapsed
                const collapseKey = `collapse-${bankNum}-${pageIndex}`;
                const isCollapsed = localStorage.getItem(collapseKey) === 'true';
                if (isCollapsed) {
                    section.classList.add('collapsed');
                }
                
                const title = document.createElement('div');
                title.className = 'page-title';
                title.innerHTML = `
                    <span class="page-title-text">${page.name} (Slots ${page.start + 1}-${page.start + page.count})</span>
                    <span class="page-title-arrow">▼</span>
                `;
                title.addEventListener('click', () => toggleSection(section));
                section.appendChild(title);

                const content = document.createElement('div');
                content.className = 'page-content';

                const grid = document.createElement('div');
                grid.className = 'slots-grid';

                for (let i = 0; i < page.count; i++) {
                    const slotIndex = page.start + i;
                    const slot = createSlot(bankNum, slotIndex);
                    grid.appendChild(slot);
                }

                content.appendChild(grid);
                section.appendChild(content);
                container.appendChild(section);
            });

            updateBankCount(bankNum);
        }
        
        function toggleSection(section) {
            section.classList.toggle('collapsed');
            
            // Save collapse state to localStorage
            const bank = section.dataset.bank;
            const page = section.dataset.page;
            const collapseKey = `collapse-${bank}-${page}`;
            const isCollapsed = section.classList.contains('collapsed');
            localStorage.setItem(collapseKey, isCollapsed);
        }

        function createSlot(bankNum, index) {
            const slot = document.createElement('div');
            const slotKey = `${bankNum}-${index}`;
            
            let className = banks[bankNum][index] ? 'slot filled' : 'slot empty';
            if (selectedSlots.has(slotKey)) {
                className += ' selected';
            }
            
            slot.className = className;
            slot.dataset.bank = bankNum;
            slot.dataset.index = index;
            slot.draggable = banks[bankNum][index] !== null || selectedSlots.size > 0;

            slot.innerHTML = `
                <div class="slot-number">Slot ${index + 1} (Note ${index})</div>
                <div class="slot-name">${banks[bankNum][index] || 'Empty'}</div>
                ${banks[bankNum][index] ? '<button class="remove-btn" onclick="removePreset(event, ' + bankNum + ', ' + index + ')">×</button>' : ''}
            `;

            // Drag events
            slot.addEventListener('dragstart', handleDragStart);
            slot.addEventListener('dragover', handleDragOver);
            slot.addEventListener('drop', handleDrop);
            slot.addEventListener('dragleave', handleDragLeave);
            slot.addEventListener('click', handleSlotClick);
            slot.addEventListener('dblclick', handleSlotDoubleClick);

            return slot;
        }

        function handleSlotClick(e) {
            if (e.target.classList.contains('remove-btn')) return;
            
            const slot = e.currentTarget;
            const bank = slot.dataset.bank;
            const index = parseInt(slot.dataset.index);
            const slotKey = `${bank}-${index}`;
            
            // Check for modifier keys
            const isCmdOrCtrl = e.metaKey || e.ctrlKey;
            const isShift = e.shiftKey;
            
            if (isShift && lastSelectedSlot) {
                // Range selection
                const [lastBank, lastIndex] = lastSelectedSlot.split('-').map(Number);
                
                // Only allow range selection within same bank
                if (parseInt(bank) === lastBank) {
                    const start = Math.min(lastIndex, index);
                    const end = Math.max(lastIndex, index);
                    
                    for (let i = start; i <= end; i++) {
                        const key = `${bank}-${i}`;
                        if (banks[bank][i]) { // Only select filled slots
                            selectedSlots.add(key);
                        }
                    }
                    
                    renderBank(parseInt(bank));
                    setStatus(`Selected ${end - start + 1} slots`, 'success');
                }
            } else if (isCmdOrCtrl) {
                // Multi-selection (toggle)
                if (selectedSlots.has(slotKey)) {
                    selectedSlots.delete(slotKey);
                } else {
                    if (banks[bank][index]) { // Only select filled slots
                        selectedSlots.add(slotKey);
                    }
                }
                lastSelectedSlot = slotKey;
                renderBank(parseInt(bank));
                setStatus(`${selectedSlots.size} slots selected`, 'success');
            } else {
                // Single selection (clear others)
                selectedSlots.clear();
                if (banks[bank][index]) { // Only select filled slots
                    selectedSlots.add(slotKey);
                    lastSelectedSlot = slotKey;
                }
                renderBank(parseInt(bank));
                if (selectedSlots.size > 0) {
                    setStatus('Slot selected (double-click to rename)', 'success');
                }
            }
        }
        
        function handleSlotDoubleClick(e) {
            if (e.target.classList.contains('remove-btn')) return;
            
            const slot = e.currentTarget;
            const bank = slot.dataset.bank;
            const index = slot.dataset.index;

            const presetName = prompt('Enter preset filename (e.g., "LABS - Percussion.adg"):', banks[bank][index] || '');
            if (presetName !== null && presetName.trim() !== '') {
                banks[bank][index] = presetName.trim();
                selectedSlots.clear();
                renderBank(parseInt(bank));
                saveState();
                setStatus('Preset updated', 'success');
            } else if (presetName === '') {
                banks[bank][index] = null;
                selectedSlots.clear();
                renderBank(parseInt(bank));
                saveState();
                setStatus('Preset removed', 'success');
            }
        }

        function removePreset(e, bank, index) {
            e.stopPropagation();
            banks[bank][index] = null;
            renderBank(bank);
            saveState();
            setStatus('Preset removed', 'success');
        }

        let draggedSlot = null;
        let draggedGroup = null;

        function handleDragStart(e) {
            draggedSlot = e.currentTarget;
            const slotKey = `${e.currentTarget.dataset.bank}-${e.currentTarget.dataset.index}`;
            
            // Check if dragging a selected group
            if (selectedSlots.size > 1 && selectedSlots.has(slotKey)) {
                // Dragging a group
                draggedGroup = Array.from(selectedSlots).map(key => {
                    const [bank, index] = key.split('-').map(Number);
                    return { bank, index, preset: banks[bank][index] };
                });
                e.currentTarget.style.opacity = '0.5';
                // Also fade all selected slots
                document.querySelectorAll('.slot.selected').forEach(slot => {
                    slot.style.opacity = '0.5';
                });
            } else {
                // Single slot drag
                draggedGroup = null;
                e.currentTarget.style.opacity = '0.5';
            }
        }

        function handleDragOver(e) {
            e.preventDefault();
            e.currentTarget.classList.add('drag-over');
        }

        function handleDragLeave(e) {
            e.currentTarget.classList.remove('drag-over');
        }

        function handleDrop(e) {
            e.preventDefault();
            e.currentTarget.classList.remove('drag-over');

            const targetSlot = e.currentTarget;
            
            // Check if files were dropped (from file system)
            if (e.dataTransfer.files && e.dataTransfer.files.length > 0) {
                const targetBank = parseInt(targetSlot.dataset.bank);
                let targetIndex = parseInt(targetSlot.dataset.index);
                
                const files = Array.from(e.dataTransfer.files);
                const adgFiles = files.filter(f => f.name.toLowerCase().endsWith('.adg'));
                
                if (adgFiles.length === 0) {
                    setStatus('Only .adg files are supported', '');
                    return;
                }
                
                let addedCount = 0;
                
                // Add files sequentially starting from target slot
                for (const file of adgFiles) {
                    if (targetIndex >= 112) {
                        // Reached end of bank
                        setStatus(`Added ${addedCount} presets (reached end of bank)`, 'success');
                        renderBank(targetBank);
                        if (draggedSlot) {
                            draggedSlot.style.opacity = '1';
                            draggedSlot = null;
                        }
                        return;
                    }
                    
                    banks[targetBank][targetIndex] = file.name;
                    targetIndex++;
                    addedCount++;
                }
                
                renderBank(targetBank);
                saveState();
                
                if (adgFiles.length === 1) {
                    setStatus(`Added preset: ${adgFiles[0].name}`, 'success');
                } else {
                    setStatus(`Added ${addedCount} presets starting at slot ${parseInt(targetSlot.dataset.index) + 1}`, 'success');
                }
                
                if (draggedSlot) {
                    draggedSlot.style.opacity = '1';
                    draggedSlot = null;
                }
                return;
            }
            
            // Otherwise, handle slot-to-slot drag
            if (draggedGroup && draggedGroup.length > 0) {
                // Group drag - place presets sequentially
                const targetBank = parseInt(targetSlot.dataset.bank);
                let targetIndex = parseInt(targetSlot.dataset.index);
                
                // Clear original positions
                draggedGroup.forEach(item => {
                    banks[item.bank][item.index] = null;
                });
                
                // Place presets sequentially at target
                let placedCount = 0;
                for (const item of draggedGroup) {
                    if (targetIndex >= 112) {
                        break; // Reached end of bank
                    }
                    banks[targetBank][targetIndex] = item.preset;
                    targetIndex++;
                    placedCount++;
                }
                
                // Clear selection
                selectedSlots.clear();
                lastSelectedSlot = null;
                
                // Re-render all affected banks
                const affectedBanks = new Set([targetBank, ...draggedGroup.map(item => item.bank)]);
                affectedBanks.forEach(bankNum => renderBank(bankNum));
                
                setStatus(`Moved ${placedCount} presets`, 'success');
                
                // Reset opacity for all selected slots
                document.querySelectorAll('.slot.selected').forEach(slot => {
                    slot.style.opacity = '1';
                });
                
                saveState();
                draggedGroup = null;
            } else if (draggedSlot && draggedSlot !== targetSlot) {
                // Single slot drag - swap
                const sourceBank = parseInt(draggedSlot.dataset.bank);
                const sourceIndex = parseInt(draggedSlot.dataset.index);
                const targetBank = parseInt(targetSlot.dataset.bank);
                const targetIndex = parseInt(targetSlot.dataset.index);

                // Swap presets
                const temp = banks[targetBank][targetIndex];
                banks[targetBank][targetIndex] = banks[sourceBank][sourceIndex];
                banks[sourceBank][sourceIndex] = temp;

                renderBank(sourceBank);
                if (sourceBank !== targetBank) {
                    renderBank(targetBank);
                }

                saveState();
                setStatus('Presets swapped', 'success');
            }

            if (draggedSlot) {
                draggedSlot.style.opacity = '1';
                draggedSlot = null;
            }
        }

        function updateBankCount(bankNum) {
            const filled = banks[bankNum].filter(p => p !== null).length;
            document.getElementById(`bank${bankNum}-count`).textContent = `${filled}/112 filled`;
        }

        // Import X-Controls.txt
        document.getElementById('importFile').addEventListener('change', function(e) {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                parseXControls(event.target.result);
                saveState(); // Save state after import
                setStatus('File imported successfully!', 'success');
            };
            reader.readAsText(file);
            
            // Reset input so same file can be imported again
            e.target.value = '';
        });

        function parseXControls(content) {
            const lines = content.split('\n');
            let inBankSection = false;
            let headerLines = [];
            let footerLines = [];
            preservedControls = [];

            for (let i = 0; i < lines.length; i++) {
                const line = lines[i].trim();

                // Detect bank sections (support B1-B5)
                if (line.startsWith('PAD_') && /_B\d =/.test(line)) {
                    inBankSection = true;
                    
                    // Parse preset name
                    const match = line.match(/SEL\/SWAP "([^"]+)"/);
                    if (match) {
                        const presetName = match[1];
                        const bankMatch = line.match(/PAD_(\d+)_B(\d)/);
                        if (bankMatch) {
                            const padNum = parseInt(bankMatch[1]) - 1; // Convert to 0-indexed
                            const bankNum = parseInt(bankMatch[2]);
                            if (padNum >= 0 && padNum < 112 && bankNum >= 1 && bankNum <= 5) {
                                banks[bankNum][padNum] = presetName;
                            }
                        }
                    }
                } else if (line.startsWith('SHOW_PLUGIN') || line.startsWith('HIDE_PLUGIN') || 
                          (line.includes('=') && !line.startsWith('#') && !line.startsWith('[') && line.length > 0)) {
                    // This is a preserved control
                    if (!line.startsWith('PAD_')) {
                        preservedControls.push(lines[i]); // Keep original formatting
                    }
                } else if (!inBankSection && line.length > 0) {
                    headerLines.push(lines[i]);
                }
            }

            preservedHeader = headerLines.join('\n');
            preservedFooter = preservedControls.join('\n');

            // Update UI - render all 5 banks
            for (let i = 1; i <= 5; i++) {
                renderBank(i);
            }
            displayPreservedControls();
        }

        function displayPreservedControls() {
            const container = document.getElementById('preservedList');
            if (preservedControls.length === 0) {
                container.innerHTML = '<div style="color: #666;">No custom controls found</div>';
            } else {
                container.innerHTML = preservedControls
                    .map(line => `<div>✅ ${line.trim()}</div>`)
                    .join('');
            }
        }

        function clearAll() {
            if (!confirm('Are you sure you want to clear all presets? This cannot be undone.')) return;
            
            for (let i = 1; i <= 5; i++) {
                banks[i] = Array(112).fill(null);
                renderBank(i);
            }
            setStatus('All presets cleared', 'success');
        }

        // Derive a clean track name from a preset filename
        // e.g. "1 - A Drums (Masch).adg" → "A Drums (Masch)"
        //      "Omnisphere 5.adg" → "Omnisphere 5"
        //      "808 Pure.adg" → "808 Pure"
        function deriveTrackName(presetFilename) {
            if (!presetFilename || presetFilename === 'PLACEHOLDER') return null;
            // Strip .adg extension
            let name = presetFilename.replace(/\.adg$/i, '');
            // Strip leading number + separator (e.g. "1 - ", "12 - ")
            name = name.replace(/^\d+\s*-\s*/, '');
            return name.trim();
        }

        // Get the Ableton color index for a slot based on which section it belongs to
        function getColorIndexForSlot(slotIndex) {
            for (const page of pages) {
                if (slotIndex >= page.start && slotIndex < page.start + page.count) {
                    return page.colorIndex;
                }
            }
            return 69; // Default white
        }

        function generateXControlsText() {
            let output = preservedHeader || getDefaultHeader();
            output += '\n\n';

            // Generate for all 5 banks
            for (let bankNum = 1; bankNum <= 5; bankNum++) {
                output += '# ----------------------------------------------------------------------------------------\n';
                output += `# BANK ${bankNum} - MIDI CHANNEL ${bankNum} (Notes 0-111)\n`;
                output += '# ----------------------------------------------------------------------------------------\n\n';

                pages.forEach(page => {
                    output += `# ${page.name.toUpperCase()} (Notes ${page.start}-${page.start + page.count - 1})\n`;
                    for (let i = 0; i < page.count; i++) {
                        const index = page.start + i;
                        const preset = banks[bankNum][index] || 'PLACEHOLDER';
                        const trackName = deriveTrackName(preset);
                        const colorIdx = page.colorIndex;
                        let line = `PAD_${index + 1}_B${bankNum} = NOTE, ${bankNum}, ${index}, 0, 127, SEL/DEV(1) SEL ; WAIT 1 ; SEL/SWAP "${preset}"`;
                        // Add NAME and COLOR actions for real presets (not placeholders)
                        if (trackName) {
                            line += ` ; SEL/NAME "${trackName}" ; SEL/COLOR ${colorIdx}`;
                        }
                        output += line + '\n';
                    }
                    output += '\n';
                });
            }

            // Add preserved controls
            if (preservedFooter) {
                output += '# ----------------------------------------------------------------------------------------\n';
                output += '# CUSTOM CONTROLS (PRESERVED)\n';
                output += '# ----------------------------------------------------------------------------------------\n\n';
                output += preservedFooter + '\n';
            }

            return output;
        }

        function getDefaultHeader() {
            return `#********************************** [SETTINGS NOTES] **********************************

# Please DO NOT change any of the spacing in this file.

# After saving this file, you will need to load a new Live Set/reload the
# current Live Set for your changes to take effect.

# --------------------------------------------------------------------------------------

[X-CONTROLS]

# 5-BANK CHANNEL-BASED PRESET SYSTEM (560 total presets)
# Generated by ClyphX Pro Preset Manager

# --------------------------------------------------------------------------------------`;
        }

        function showPreview() {
            const text = generateXControlsText();
            document.getElementById('previewText').value = text;
            document.getElementById('previewModal').classList.add('active');
        }

        function closePreview() {
            document.getElementById('previewModal').classList.remove('active');
        }

        function generateFile() {
            const text = generateXControlsText();
            const blob = new Blob([text], { type: 'text/plain' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = 'X-Controls.txt';
            a.click();
            URL.revokeObjectURL(url);
            
            closePreview();
            setStatus('File downloaded! Replace your existing X-Controls.txt', 'success');
        }

        function setStatus(message, type = '') {
            const status = document.getElementById('status');
            status.textContent = message;
            status.className = type ? `status ${type}` : 'status';
            
            if (message) {
                setTimeout(() => {
                    status.textContent = '';
                    status.className = 'status';
                }, 5000);
            }
        }

        // Undo/Redo system
        function saveState() {
            // Create deep copy of current state
            const state = {
                banks: {
                    1: [...banks[1]],
                    2: [...banks[2]],
                    3: [...banks[3]],
                    4: [...banks[4]],
                    5: [...banks[5]]
                }
            };
            
            // Remove any future history if we're not at the end
            if (historyIndex < history.length - 1) {
                history = history.slice(0, historyIndex + 1);
            }
            
            // Add new state
            history.push(state);
            
            // Keep history within limit
            if (history.length > MAX_HISTORY) {
                history.shift();
            } else {
                historyIndex++;
            }
            
            updateUndoRedoButtons();
        }
        
        function undo() {
            if (historyIndex > 0) {
                historyIndex--;
                restoreState(history[historyIndex]);
                setStatus('Undone', 'success');
            }
        }
        
        function redo() {
            if (historyIndex < history.length - 1) {
                historyIndex++;
                restoreState(history[historyIndex]);
                setStatus('Redone', 'success');
            }
        }
        
        function restoreState(state) {
            for (let i = 1; i <= 5; i++) {
                banks[i] = [...state.banks[i]];
                renderBank(i);
            }
            updateUndoRedoButtons();
        }
        
        function updateUndoRedoButtons() {
            document.getElementById('undoBtn').disabled = historyIndex <= 0;
            document.getElementById('redoBtn').disabled = historyIndex >= history.length - 1;
        }

        // Keyboard shortcuts
        document.addEventListener('keydown', function(e) {
            // Cmd/Ctrl + Z = Undo
            if ((e.metaKey || e.ctrlKey) && e.key === 'z' && !e.shiftKey) {
                e.preventDefault();
                undo();
            }
            // Cmd/Ctrl + Shift + Z = Redo
            else if ((e.metaKey || e.ctrlKey) && e.key === 'z' && e.shiftKey) {
                e.preventDefault();
                redo();
            }
            // Cmd/Ctrl + Y = Redo (alternative)
            else if ((e.metaKey || e.ctrlKey) && e.key === 'y') {
                e.preventDefault();
                redo();
            }
            // Delete/Backspace = Remove selected presets
            else if ((e.key === 'Delete' || e.key === 'Backspace') && selectedSlots.size > 0) {
                e.preventDefault();
                deleteSelectedPresets();
            }
        });
        
        function deleteSelectedPresets() {
            if (selectedSlots.size === 0) return;
            
            const affectedBanks = new Set();
            const count = selectedSlots.size;
            
            // Delete all selected presets
            selectedSlots.forEach(slotKey => {
                const [bank, index] = slotKey.split('-').map(Number);
                banks[bank][index] = null;
                affectedBanks.add(bank);
            });
            
            // Clear selection
            selectedSlots.clear();
            lastSelectedSlot = null;
            
            // Re-render affected banks
            affectedBanks.forEach(bankNum => renderBank(bankNum));
            
            // Save state for undo
            saveState();
            
            setStatus(`Deleted ${count} preset${count > 1 ? 's' : ''}`, 'success');
        }

        // Initialize with initial state
        saveState();
        initBanks();
        setStatus('Ready! Import your X-Controls.txt or start adding presets.', 'success');
    </script>
</body>
</html>
